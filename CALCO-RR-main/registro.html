<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Samuel Giraldo Villanueva</title>
        <meta name="description" content="Calculadora de materiales de construccion">
        <meta name="keywords" content="HTML, CSS, JavaScript, Fundacion Escuela Tecnologica de Neiva, calculadora, materiales, construccion, cemento, arena, piedra, ladrillo, bloque, madera, hierro">

        <link rel="icon" type="image/jpeg" href="calco.jpg">
        <link rel="icon" type="image/jpeg" href="favicon.jpg">
        <link rel="stylesheet" href="styles.css">
        <script src="https://kit.fontawesome.com/9d1a86738f.js"  crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="pantalla">
            <aside class="panel-oscuro">
            <img class = "logo" src="calco2.png" alt="Logo CALCO"> 
    </aside>

            <section class="panel-claro">
        <span class="etiqueta">NUEVA CUENTA</span>
            <h1>Registrarse</h1>
            <form class="form-login">
                        <input class="inputs" type="email" placeholder="Correo electrónico" maxlength="50" minlength="4" title="Introduce tu correo electrónico" pattern="^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-zA-Z]{1,5}$" required>
                        <input class="inputs" type="password" placeholder="Contraseña" maxlength="25" minlength="8" title="Introduce tu contraseña" pattern=".{8,25}" required>
                        <input class="inputs" type="password" placeholder="Confirmar contraseña" maxlength="25" minlength="8" title="Confirma tu contraseña" pattern=".{8,25}" required>
                        <button class="btn" type="submit" name="registrar" value="Registrarse">Registrarse</button>           
                        <a class="redireccion" href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
                    </form>

    </section>
    </div>
        <footer>
            <small class="creditos">SAMUEL &copy; 2026</small>
            <a href="registro.html" class="footer-link">REGISTRO</a>
        </footer>
    </body>
</html>
