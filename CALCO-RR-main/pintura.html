<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCO - Pintura</title>
    <link rel="stylesheet" href="muro.css">
    <script src="https://kit.fontawesome.com/9d1a86738f.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="pantalla">

        <aside class="panel-oscuro">
            <div class="logo-contenedor">
                <div class="logo-circulo"><span class="punto"></span></div>
                <div class="logo-texto">CALCO</div>
            </div>
            <nav class="menu-lateral">
                <a href="muro.html" class="nav-item"><div class="numero">1</div> Muro de ladrillo</a>
                <a href="viga.html" class="nav-item"><div class="numero">2</div> Viga de hormigón</a>
                <a href="columna.html" class="nav-item"><div class="numero">3</div> Columnas de hormigón</a>
                <a href="contrapiso.html" class="nav-item"><div class="numero">4</div> Contrapisos</a>
                <a href="techo.html" class="nav-item"><div class="numero">5</div> Techo</a>
                <a href="piso.html" class="nav-item"><div class="numero">6</div> Pisos</a>
                <a href="pintura.html" class="nav-item activo"><div class="numero">7</div> Pintura</a>
            </nav>
            <div class="salir-container">
                <a href="login.html" class="nav-item"><div class="numero">8</div> Salir</a>
            </div>
        </aside>

        <main class="panel-claro">
            <div class="contenido-formulario">
                <a href="menu-principal.html" class="enlace-menu">← MENÚ</a>
                <span class="subtitulo">CÁLCULO 7 DE 7</span>
                <h1>Pintura</h1>

                <form class="form-calculo" action="resultado-pintura.html" method="GET">
                    <label>SUPERFICIE</label>
                    <div class="grupo-opciones">
                        <input type="radio" id="pntInt" name="superficie" value="Interior" class="radio-opcion" checked>
                        <label for="pntInt" class="btn-opcion">Interior</label>

                        <input type="radio" id="pntExt" name="superficie" value="Exterior" class="radio-opcion">
                        <label for="pntExt" class="btn-opcion">Exterior</label>
                    </div>

                    <label>MANOS DE PINTURA</label>
                    <div class="grupo-opciones">
                        <input type="radio" id="mno1" name="manos" value="1" class="radio-opcion">
                        <label for="mno1" class="btn-opcion">1 mano</label>

                        <input type="radio" id="mno2" name="manos" value="2" class="radio-opcion" checked>
                        <label for="mno2" class="btn-opcion">2 manos</label>

                        <input type="radio" id="mno3" name="manos" value="3" class="radio-opcion">
                        <label for="mno3" class="btn-opcion">3 manos</label>
                    </div>

                    <label for="largo">LARGO</label>
                    <div class="input-contenedor">
                        <input type="number" id="largo" name="largo" value="4.00" step="0.01" required>
                        <span class="unidad">m</span>
                    </div>

                    <label for="alto">ALTO</label>
                    <div class="input-contenedor">
                        <input type="number" id="alto" name="alto" value="2.50" step="0.01" required>
                        <span class="unidad">m</span>
                    </div>

                    <button type="submit" class="btn-calcular">CALCULAR</button>
                </form>
            </div>
        </main>
    </div>

    <footer>
        <small class="creditos">PINTURA</small>
        <small class="creditos-derecha">HOJA 16 · CALCO v1.0 &nbsp;&nbsp;&nbsp; ESC. N.T.S.</small>
    </footer>
</body>
</html>
